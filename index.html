<h1>Student Registration Form</h1>
<form>
    <label for="Roll Number">Roll Number:</label>
    <input type="text" id="Roll Number" name="Roll Number"><br><br>
    <label for=" First Name"> First Name:</label>
    <input type="text" id=" First Name" name=" First Name">
    <LAbel>Last Name:</LAbel>
    <input type="text" id="Last Name" name="Last Name"><br><br>
    <label for="Date of Birth">Date of Birth:</label>
    <input type="date" id="Date of Birth" name="Date of Birth"><br><br>
    <label for="Mobile.no">Mobile Number:</label>
    <select name="Mobile.no" id="Mobile.no">
        <option value="+92">+92</option>
        <option value="+1">+1</option>
        <option value="+44">+44</option>
        <option value="+61">+61</option>
        <option value="+81">+81</option>
        <option value="+49">+49</option>
        <option value="+91">+91</option>
    </select>
    <input type="text" id="Mobile.no" name="Mobile.no"><br><br>
    <label for="Email.id">Email.id:</label>
    <input type="email" id="Email.id" name="Email.id"><br><br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password"><br><br>
   <label>Sex:</label>
    <input type="radio" name="Sex" id="Male" value="Male">
    <label for="Male">Male</label>
    <input type="radio" name="Sex" id="Female" value="Female">
    <label for="Female">Female</label>
    <input type="radio" name="Sex" id="Other" value="Other">
    <label for="Other">Other</label><br><br>
    <label> Department:</label>
    <input type="radio" name="Department" id="CSE" value="CSE">
    <label for="CSE">Computer Science and Engineering</label>
    <input type="radio" name="Department" id="ECE" value="ECE">
    <label for="ECE">Electrical and Computer Engineering</label>
    <input type="radio" name="Department" id="IT" value="IT">
    <label for="IT">Information Technology</label>
    <input type="radio" name="Department" id="CIVIL" value="CIVIL">
    <label for="CIVIL">Civil Engineering</label>
    <input type="radio" name="Department" id="MECH" value="MECH">
    <label for="MECH">Mechanical Engineering</label><br><br>
    <label for="Select Course">Select Course:</label>
    <select name="Select Course" id="Select Course">
        
        
        <option value="Graphics Design">Graphics Design</option>
        <option value="Modern Web Applications Development">Modern Web Applications Development</option>
        <option value="Digital Marketing">Digital Marketing</option>

        
    </select><br><br>
    <label for="Student Photo">Student Photo:</label>
    <input type="file" id="Student Photo" name="Student Photo"><br><br>
    <label for="City">City:</label>
    <input type="text" id="City" name="City"><br><br>
    <label for="Address">Address:</label>
    <textarea id="Address" name="Address" rows="3" cols="50"></textarea><br><br>
    <input type="submit" value="Register">
</form>
